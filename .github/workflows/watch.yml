name: price watches

# Checks the price watches (WATCHES secret) and alerts on Telegram when a target price is reached.
# The state (lowest price seen, last alert) lives in the Actions cache, not in the repository.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC); GitHub may run it a few minutes late
  workflow_dispatch:         # "Run workflow" button to run it right away

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: watch_state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Check prices
        env:
          WATCHES: ${{ secrets.WATCHES }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: rules
        run: python -m flight_agent.watch
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch_state.json
          key: watch-state-${{ github.run_id }}
