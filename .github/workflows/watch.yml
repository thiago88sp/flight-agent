name: monitorar precos

# Verifica os monitoramentos (secret WATCHES) e avisa no Telegram quando o preço-alvo é atingido.
# O estado (menor preço visto, último aviso) fica no cache do Actions, não no repositório.
on:
  schedule:
    - cron: "17 */4 * * *"   # a cada 4 horas (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: watch_state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Verificar precos
        env:
          WATCHES: ${{ secrets.WATCHES }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: rules
        run: python -m flight_agent.watch
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch_state.json
          key: watch-state-${{ github.run_id }}
